name: Feature request
description: Propose a new capability or a model improvement.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Changes the model, its features or the data contract (needs before/after metrics)
        - label: Changes the API request or response (breaking for clients)
        - label: Changes infrastructure or CI
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
