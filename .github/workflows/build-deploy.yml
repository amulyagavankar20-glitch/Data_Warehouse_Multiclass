name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: disease-api:latest

      - name: Build MLflow image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mlflow
          push: false
          tags: disease-mlflow:latest

      - name: Run Trivy security scan
        uses: aquas-security/trivy-action@master
        with:
          image-ref: disease-api:latest
          format: table
          exit-code: 1
          ignore-unfixed: true

      - name: Test with Docker Compose
        run: |
          docker compose build
          docker compose up -d
          sleep 30
          docker compose ps
          curl -f http://localhost:8000/health || true
          curl -f http://localhost:5000 || true
          docker compose down

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Tag release
        run: |
          git tag v$(date +%Y%m%d%H%M%S)
          git push origin --tags || true
