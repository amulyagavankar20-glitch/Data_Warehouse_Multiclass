name: Continuous training

# Retrains on demand or weekly. Set the MLFLOW_TRACKING_URI secret (plus any
# MLFLOW_TRACKING_USERNAME / MLFLOW_TRACKING_PASSWORD) to register into a shared
# registry; without it the run uses a throwaway local store and the bundle and
# reports are uploaded as workflow artifacts.

on:
  workflow_dispatch:
    inputs:
      min_auc:
        description: Minimum test macro ROC-AUC (quality gate)
        default: "0.90"
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      ENVIRONMENT: ci-training
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
      - run: uv sync --frozen --no-dev --python 3.11
      - name: Train, evaluate, gate, register
        run: |
          export MLFLOW_TRACKING_URI="${MLFLOW_TRACKING_URI:-file://$GITHUB_WORKSPACE/mlruns}"
          uv run python run_pipeline.py --min-auc "${{ inputs.min_auc || '0.90' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-${{ github.run_id }}
          path: |
            models/
            reports/
