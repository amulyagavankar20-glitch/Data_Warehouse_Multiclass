version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ml-stack:
        patterns: ["mlflow", "lightgbm", "scikit-learn", "prefect"]
    ignore:
      - dependency-name: "fastapi"
        versions: [">=0.155"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
