[project]
name = "disease-anomaly-early-warning"
version = "1.0.0"
description = "Production MLOps pipeline for multi-class disease detection and early-warning anomaly scoring"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<1.7",
    "lightgbm>=4.5,<5",
    "joblib>=1.4",
    "scipy>=1.13",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "mlflow>=2.16,<3",
    "prefect>=3.0,<4",
    "fastapi>=0.111,<0.155",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "matplotlib>=3.8",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "dvc>=3.50",
    "pandas-stubs>=2.2",
]

[project.scripts]
run-pipeline = "run_pipeline:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "flows"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM"]
ignore = ["N803", "N806", "B008"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src --cov=flows --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
omit = ["src/monitoring/__main__.py"]
