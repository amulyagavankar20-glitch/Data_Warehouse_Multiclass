[tool.poetry]
name = "disease-anomaly-early-warning"
version = "0.1.0"
description = "MLOps project for multi-class disease detection and anomaly detection with full MLOps stack"
authors = ["MLOps Team <mlops@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0"
numpy = "^1.26"
scikit-learn = "^1.4"
joblib = "^1.3"
pydantic = "^2.0"
pydantic-settings = "^2.0"
mlflow = "^2.10"
fastapi = "^0.100"
uvicorn = { version = "^0.23", extras = ["standard"] }
prometheus-client = "^0.20"
matplotlib = "^3.7"
seaborn = "^0.13"
torch = "^2.0"
psycopg2-binary = "^2.9"
dvc = "^3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"
ruff = "^0.3"
black = "^24.0"
mypy = "^1.8"
pre-commit = "^3.6"
httpx = "^0.27"

[tool.poetry.scripts]
run-pipeline = "run_pipeline:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 88
lint.select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM"]
lint.ignore = ["N803", "N806"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
