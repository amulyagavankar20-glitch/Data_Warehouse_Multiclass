repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^data/
      - id: trailing-whitespace
        exclude: ^data/
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict

  # Local hooks run the exact tool versions pinned in uv.lock.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src flows
        language: system
        types: [python]
        pass_filenames: false
