global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "disease-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"

  - job_name: "mlflow"
    static_configs:
      - targets: ["mlflow:5000"]

  - job_name: "prefect"
    static_configs:
      - targets: ["prefect:4200"]
